name: 'Soroban Resource Budget Guard'
description: 'Automated CI-native tracking of Soroban smart contract resource costs.'
author: 'BudgetGate'

inputs:
  github-token:
    description: 'GitHub token for posting PR comments'
    required: false
    default: ${{ github.token }}
  baseline-path:
    description: 'Path to the baseline snapshot JSON'
    required: false
    default: 'baseline.json'
  new-path:
    description: 'Path to an existing snapshot to compare when fixture-path is not set (defaults to new.json)'
    required: false
  fixture-path:
    description: 'Path to a fixture of contract calls to simulate; the measured snapshot is compared against the baseline'
    required: false
  rpc-url:
    description: 'Soroban RPC URL used with fixture-path (core defaults to testnet); pass it from a secret if it contains a key'
    required: false
  binary-path:
    description: 'Path to a budget-core binary (defaults to ./budget-core); wins over binary-version'
    required: false
  binary-version:
    description: 'soroban-budget-core release to download, e.g. 0.2.3; picks the runner''s binary (Linux, macOS or Windows, x64 or arm64; core v0.2.1 and earlier only ship Linux x64) and checks it against the release SHA256SUMS'
    required: false
  history-branch:
    description: 'Branch to keep history.json on (e.g. budgetgate-history). Each default-branch push appends its snapshot; needs contents: write. Off when empty'
    required: false

outputs:
  regression_detected:
    description: 'Boolean string true if a regression was detected'

runs:
  using: 'node24'
  main: 'dist/index.js'
