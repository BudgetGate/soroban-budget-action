name: 'Soroban Resource Budget Guard'
description: 'Automated CI-native tracking of Soroban smart contract resource costs.'
author: 'BudgetGate'

inputs:
  github-token:
    description: 'GitHub token for posting PR comments'
    required: true
    default: ${{ github.token }}
  baseline-path:
    description: 'Path to the baseline snapshot JSON'
    required: false
    default: 'baseline.json'
  new-path:
    description: 'Path to the new snapshot JSON'
    required: false
  fixture-path:
    description: 'Path to fixture JSON (if dynamically simulating)'
    required: false
  rpc-url:
    description: 'Soroban RPC URL'
    required: false
  binary-path:
    description: 'Path to the budget-core binary (if providing locally)'
    required: false
  binary-version:
    description: 'Version of budget-core to download from GitHub releases'
    required: false

outputs:
  regression_detected:
    description: 'Boolean string true if a regression was detected'

runs:
  using: 'node20'
  main: 'dist/index.js'
