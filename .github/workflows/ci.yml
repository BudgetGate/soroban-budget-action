name: Action CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        
    - run: npm ci
    - run: npm run build --if-present

    # action.yml runs the committed dist/index.js, so it must be the build of the committed src/.
    - name: Check dist/ is up to date
      id: dist
      run: |
        if ! git diff --quiet -- dist; then
          echo "::error::dist/ does not match a fresh build of src/. Run 'npm run build' and commit dist/, or download the 'dist' artifact of this run and commit it."
          git diff --stat -- dist
          exit 1
        fi

    # A build on Windows can differ from this Linux build, so offer the exact file CI expects.
    - name: Upload the fresh build of dist/
      if: failure() && steps.dist.outcome == 'failure'
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/index.js

    - run: npm test
