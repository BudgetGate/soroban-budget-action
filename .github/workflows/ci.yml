name: Action CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Build and test only read the repository, so the token gets nothing more.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    
    - name: Use Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24.x'
        
    - run: npm ci
    - run: npm run build --if-present

    # action.yml runs the committed dist/, so it must be the build of the committed src/.
    # git status, not git diff, so a new or deleted output file (such as an ncc chunk) also fails.
    - name: Check dist/ is up to date
      id: dist
      run: |
        if [ -n "$(git status --porcelain -- dist)" ]; then
          echo "::error::dist/ does not match a fresh build of src/. Run 'npm run build' and commit dist/, or download the 'dist' artifact of this run and commit it."
          git status --short -- dist
          exit 1
        fi

    # A build on Windows can differ from this Linux build, so offer the exact files CI expects.
    - name: Upload the fresh build of dist/
      if: failure() && steps.dist.outcome == 'failure'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: dist
        path: dist/

    - run: npm test
