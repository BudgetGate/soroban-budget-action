name: Audit

# Checks dependencies for known vulnerabilities every week, so a new advisory shows up as a failed
# run. Fails on any vulnerability in the bundled runtime dependencies, and on moderate or worse in
# the development ones. Also runs on every pull request, so one that adds or updates a vulnerable
# dependency shows it before merging. Not a required check: an advisory published for an unchanged
# dependency would otherwise block unrelated pull requests until it is fixed.
on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24.x'

    - run: npm ci

    # Fails if any installed package's registry signature or provenance attestation does not verify.
    - name: Registry signatures and provenance
      run: npm audit signatures

    - name: Runtime dependencies (bundled into dist/)
      run: npm audit --omit=dev

    - name: All dependencies, moderate or worse
      run: npm audit --audit-level=moderate
