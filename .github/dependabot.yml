version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      runtime:
        dependency-type: production
        update-types: [ minor, patch ]
      development:
        dependency-type: development
        update-types: [ minor, patch ]
    ignore:
      # The next majors of @actions/* are ESM-only, which this CommonJS ncc build cannot load (A5, A21).
      - dependency-name: "@actions/*"
        update-types: [ "version-update:semver-major" ]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
