name: Budget Gate (Monorepo)

on:
  pull_request:
    paths:
      - 'contracts/**'
  push:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: write

jobs:
  budget-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Run Budget Gate
        uses: BudgetGate/soroban-budget-action@v0.2.2
        with:
          fixture-path: 'contracts/fixtures/budget.json'
          binary-version: '0.2.3'
