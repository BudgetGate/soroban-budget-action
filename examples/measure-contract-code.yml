name: Budget Gate

# Measures the contract code in each commit: build it, deploy it to testnet with a throwaway
# friendbot-funded key, and write the fixture against that deployment, then compare. Copy
# build-fixture.sh to budget/build-fixture.sh, set CONTRACTS and CALLS in it, and pin your Rust
# toolchain in rust-toolchain.toml (with targets = ["wasm32v1-none"]) so every run compiles
# the same wasm.
on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: write

jobs:
  budget-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reuse downloaded crates and compiled dependencies. A fresh checkout makes the contracts'
      # own sources newer than the cache, so cargo rebuilds them every run.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: contracts-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}

      - uses: stellar/stellar-cli@c0f4d0da891bbf214c08b8c5035ae6db80e9a3bd # v28.1.0

      - name: Deploy this commit's contracts and write the fixture
        run: budget/build-fixture.sh
        env:
          # Optional: a funded testnet account's secret key, so runs do not need friendbot.
          # Empty when the repository has no such secret; the script then uses friendbot.
          # Only pushes get it: on a pull request this step runs the pull request's own code
          # (build-fixture.sh, build scripts), which could read the key.
          BUDGET_GATE_SECRET_KEY: ${{ github.event_name == 'push' && secrets.BUDGET_GATE_SECRET_KEY || '' }}

      - name: Run Budget Gate
        uses: BudgetGate/soroban-budget-action@v0.2.2
        with:
          fixture-path: budget/fixture.json
          binary-version: '0.2.5'
