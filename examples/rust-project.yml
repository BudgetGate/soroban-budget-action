name: Budget Gate

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: write

jobs:
  budget-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # The fixture calls your contract as deployed on the network; regenerate it after redeploying.
      - name: Run Budget Gate
        uses: BudgetGate/soroban-budget-action@v0.2.0
        with:
          fixture-path: 'tests/fixture.json'
          rpc-url: 'https://soroban-testnet.stellar.org'
          binary-version: '0.2.0'
